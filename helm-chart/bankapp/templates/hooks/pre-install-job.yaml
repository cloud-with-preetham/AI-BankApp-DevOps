apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "bankapp.fullname" . }}-preinstall
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: preinstall
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Running pre-install checks..."
              sleep 5
              echo "Checks completed successfully."
